name: Android APK checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android-apk-service/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exporters and server tests
        run: |
          node --check app.js
          node --check android-export.js
          npm ci --prefix android-apk-service
          npm test --prefix android-apk-service
          python3 -m unittest discover -s android-apk-service/tests -v
      - name: Build, sign and verify through the real Linux worker
        run: |
          python3 android-apk-service/tests/build_fixture.py
